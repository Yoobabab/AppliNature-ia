<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défi nature</title>
<meta name="description" content="Un défi nature lancé depuis AppliNature : trouveras-tu cette espèce ?">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1F3A2E; --paper:#E9EFE4; --girolle:#F2A62B; --myrtille:#4B3D7A; --myrtille-deep:#2A2148; --soft:#DCD6EE; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Bricolage Grotesque', system-ui, sans-serif; background:var(--myrtille-deep); color:#fff; min-height:100vh; }
  main { max-width:480px; margin:0 auto; padding:32px 16px 48px; display:flex; flex-direction:column; gap:20px; }
  .sur { text-transform:uppercase; letter-spacing:.14em; font-size:12px; font-weight:700; color:var(--girolle); }
  h1 { font-size:40px; line-height:1.02; letter-spacing:-.02em; margin:0; font-weight:800; }
  .espece { font-size:22px; font-weight:700; color:var(--girolle); margin:0; }
  p { margin:0; color:var(--soft); line-height:1.45; }
  #carte { height:280px; border-radius:24px; overflow:hidden; border:1px solid rgba(255,255,255,.15); background:#3a3160; }
  #carte .leaflet-tile-pane { filter: blur(1.5px) saturate(.6); }
  .bouton { display:block; text-align:center; padding:16px; border-radius:999px; font-weight:700; text-decoration:none; font-size:17px; }
  .plein { background:var(--girolle); color:var(--ink); }
  .vide { border:2px solid rgba(255,255,255,.5); color:#fff; }
  .note { font-size:13px; opacity:.75; }
</style>
</head>
<body>
<main>
  <div class="sur" id="sur">Défi nature</div>
  <h1>Je te défie de la trouver</h1>
  <p class="espece" id="espece">Une espèce rare</p>
  <p id="detail"></p>
  <div id="carte" role="img" aria-label="Aperçu flou de la zone de la balade"></div>
  <p class="note">La zone est volontairement floue : l’endroit exact reste secret. À toi de chercher.</p>
  <a class="bouton plein" id="ouvrir" href="#">Ouvrir le défi dans l’appli</a>
  <a class="bouton vide" href="https://github.com/Yoobabab/AppliNature-ia">L’appli arrive bientôt sur l’App Store et le Play Store</a>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // Paramètres : e = espèce, r = rareté, o = nombre d'observations, d = date, p = tracé flou (polyline, précision 3).
  const q = new URLSearchParams(location.search);
  const espece = q.get('e');
  if (espece) { document.getElementById('espece').textContent = espece; document.title = 'Défi : ' + espece; }
  const morceaux = [];
  if (q.get('o')) morceaux.push('Observée seulement ' + q.get('o') + ' fois dans son secteur.');
  if (q.get('d')) morceaux.push('Trouvée le ' + q.get('d') + '.');
  document.getElementById('detail').textContent = morceaux.join(' ');
  if (q.get('r') === 'rare') document.getElementById('sur').textContent = 'Défi nature · espèce rare';
  document.getElementById('ouvrir').href = 'applinature://defi' + location.search;

  function decoder(s, precision) {
    const f = Math.pow(10, precision); let i = 0, lat = 0, lon = 0; const out = [];
    while (i < s.length) {
      for (const k of [0, 1]) {
        let r = 0, sh = 0, b;
        do { b = s.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
        const d = (r & 1) ? ~(r >> 1) : (r >> 1);
        if (k === 0) lat += d; else lon += d;
      }
      out.push([lat / f, lon / f]);
    }
    return out;
  }
  const pts = q.get('p') ? decoder(q.get('p'), 3) : [];
  const carte = L.map('carte', { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, keyboard: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 13, attribution: '© OpenStreetMap' }).addTo(carte);
  if (pts.length > 1) {
    const ligne = L.polyline(pts, { color: '#F2A62B', weight: 10, opacity: .55, lineCap: 'round', lineJoin: 'round' }).addTo(carte);
    carte.fitBounds(ligne.getBounds(), { padding: [30, 30], maxZoom: 13 });
  } else {
    carte.setView([46.6, 2.4], 5);
  }
</script>
</body>
</html>
