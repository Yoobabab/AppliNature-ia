# Robot d'entraînement de l'IA d'AppliNature (dépôt public : robot illimité, 4 cœurs).
# Il tourne « en boucle » : rassemble des photos libres de droits (GBIF) — sur
# plusieurs passages si besoin —, entraîne le modèle, le vérifie, le publie dans
# une « Release », puis, si l'objectif n'est pas atteint, recommence avec plus
# de photos par espèce. L'appli (dépôt privé) vient chercher le modèle.
name: Entraîner l'IA

on:
  workflow_dispatch:
    inputs:
      groupe:
        description: Groupe d'espèces
        type: choice
        options: [champignons, arbres, fleurs, plantes]
        default: champignons
      especes:
        description: Nombre d'espèces
        default: '150'
      par_espece:
        description: Photos par espèce
        default: '400'
      alpha:
        description: Taille du réseau (0.5 rapide, 0.75 plus juste mais ~2 fois plus lent)
        type: choice
        options: ['0.5', '0.75', '1.0']
        default: '0.75'
      epoques_fines:
        description: Nombre de tours d'affinage
        default: '20'
      figer:
        description: Part du réseau figée pendant l'affinage (0.2 = on affine 80 %)
        default: '0.25'
      tours:
        description: Nombre de boucles restantes (1 = une seule fois)
        default: '1'
      cible:
        description: Objectif « bonne espèce dans les 3 premières idées » (0.90 = 90 %)
        default: '0.90'
      ajout:
        description: Photos par espèce ajoutées à chaque boucle
        default: '300'
      maximum:
        description: Photos par espèce au maximum
        default: '900'

concurrency:
  group: ia-${{ inputs.groupe }}
  cancel-in-progress: false

jobs:
  entrainer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    env:
      G: ${{ inputs.groupe }}
      GH_TOKEN: ${{ github.token }}
      CLE: ia-photos-${{ inputs.groupe }}-${{ inputs.especes }}-${{ inputs.par_espece }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer TensorFlow
        run: |
          echo "DEBUT=$(date +%s)" >> "$GITHUB_ENV"
          pip install --quiet tensorflow-cpu==2.21.0 pillow requests

      - name: Reprendre les photos déjà téléchargées
        uses: actions/cache/restore@v4
        with:
          path: donnees
          key: ${{ env.CLE }}
          restore-keys: |
            ia-photos-${{ inputs.groupe }}-${{ inputs.especes }}-${{ inputs.par_espece }}-
            ia-photos-${{ inputs.groupe }}-${{ inputs.especes }}-
            ia-photos-${{ inputs.groupe }}-

      - name: Rassembler les photos libres
        run: |
          set -o pipefail
          du -sh donnees 2>/dev/null || true
          python outils/ia/collecter.py "$G" --dossier donnees --especes "${{ inputs.especes }}" --par-espece "${{ inputs.par_espece }}" --limite-minutes 200 2>&1 | tee -a journal.txt
          du -sh donnees | tee -a journal.txt
          python3 -c "import json;e=json.load(open('donnees/$G/etat.json'));print('COMPLET=' + ('1' if e['complet'] else '0'))" >> "$GITHUB_ENV"

      - name: Garder les photos pour la prochaine fois
        if: always()
        uses: actions/cache/save@v4
        with:
          path: donnees
          key: ${{ env.CLE }}

      # Le stockage des caches est limité (10 Go) : on efface les anciennes copies de ce groupe.
      - name: Effacer les anciennes copies des photos
        if: always()
        run: |
          gh api "repos/${{ github.repository }}/actions/caches?key=ia-photos-$G-&per_page=100" --jq '.actions_caches[].key' | while read -r k; do
            [ "$k" != "$CLE" ] && gh api -X DELETE "repos/${{ github.repository }}/actions/caches?key=$k" >/dev/null && echo "effacé : $k"
          done || true

      # Collecte pas finie, ou plus assez de temps pour bien entraîner : on relance un passage (les photos sont gardées).
      - name: Décider de la suite
        run: |
          RESTE=$(( 340 - ( $(date +%s) - DEBUT ) / 60 ))
          echo "Minutes restantes : $RESTE" | tee -a journal.txt
          if [ "$COMPLET" != "1" ] || [ "$RESTE" -lt 150 ]; then echo "RELANCE=1" >> "$GITHUB_ENV"; else echo "RELANCE=0" >> "$GITHUB_ENV"; fi
          echo "MINUTES_ENTRAINEMENT=$(( RESTE - 25 ))" >> "$GITHUB_ENV"

      - name: Relancer un passage de collecte
        if: env.RELANCE == '1'
        run: |
          echo "Collecte à poursuivre : nouveau passage." | tee -a journal.txt
          gh workflow run entrainer.yml --ref main -f groupe="$G" -f especes="${{ inputs.especes }}" -f par_espece="${{ inputs.par_espece }}" -f alpha="${{ inputs.alpha }}" \
            -f epoques_fines="${{ inputs.epoques_fines }}" -f figer="${{ inputs.figer }}" -f tours="${{ inputs.tours }}" -f cible="${{ inputs.cible }}" \
            -f ajout="${{ inputs.ajout }}" -f maximum="${{ inputs.maximum }}"

      - name: Entraîner
        if: env.RELANCE == '0'
        env:
          IA_ALPHA: ${{ inputs.alpha }}
          IA_FIGER: ${{ inputs.figer }}
        run: |
          set -o pipefail
          mkdir -p sortie
          python outils/ia/entrainer.py "$G" --dossier donnees --sortie sortie --reference "sortie/ia-$G.json" --epoques-fines "${{ inputs.epoques_fines }}" --limite-minutes "$MINUTES_ENTRAINEMENT" 2>&1 | grep -v -E "^(I0000|W0000)|oneDNN|cpu_feature_guard|To enable the following" | tee -a journal.txt

      - uses: actions/setup-node@v6
        if: env.RELANCE == '0'
        with:
          node-version: 22

      - name: Vérifier que l'appli lit le modèle comme l'entraînement
        if: env.RELANCE == '0'
        run: node --experimental-strip-types outils/ia/verifier.ts "sortie/$G.an1" "sortie/ia-$G.json" 2>&1 | tee -a journal.txt

      - name: Publier le modèle et décider d'une nouvelle boucle
        if: env.RELANCE == '0'
        run: |
          cp "donnees/$G/credits.csv" "sortie/credits-$G.csv"
          cp "donnees/$G/especes.json" "sortie/especes-$G.json"
          TOP3=$(grep -h "^Résultat" journal.txt | tail -1 | grep -oE "'top3': [0-9.]+" | grep -oE "[0-9.]+$")
          TOP1=$(grep -h "^Résultat" journal.txt | tail -1 | grep -oE "'top1': [0-9.]+" | grep -oE "[0-9.]+$")
          # Le meilleur score déjà publié pour ce groupe.
          AVANT=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq "[.[] | select(.tag_name | startswith(\"$G-\")) | .body | capture(\"'top3': (?<t>[0-9.]+)\").t | tonumber] | max // 0")
          MIEUX=$(python3 -c "print(1 if $TOP3 > $AVANT else 0)")
          TAG="$G-$(date +%Y%m%d-%H%M)"
          grep -h "^Résultat" journal.txt | tail -1 > notes.txt
          echo "alpha ${{ inputs.alpha }}, ${{ inputs.par_espece }} photos par espèce, ${{ inputs.epoques_fines }} tours d'affinage, part figée ${{ inputs.figer }}" >> notes.txt
          echo "Dans les 3 premières : $TOP3 (meilleur avant : $AVANT)" >> notes.txt
          TITRE="IA $G ($(date +%F)) : 1re idée $TOP1, 3 premières $TOP3"
          [ "$MIEUX" = "1" ] && TITRE="$TITRE ★ meilleur"
          gh release create "$TAG" "sortie/$G.an1" "sortie/ia-$G.json" "sortie/credits-$G.csv" "sortie/especes-$G.json" --title "$TITRE" --notes-file notes.txt
          echo "Publié : $TAG, 3 premières $TOP3 (avant $AVANT)" | tee -a journal.txt
          # Nouvelle boucle tant que l'objectif n'est pas atteint : d'abord plus de photos par espèce,
          # puis, quand on est au maximum de photos, une IA plus grosse (alpha 1.0).
          # L'objectif peut être relevé dans objectif.txt (sans toucher aux boucles déjà lancées).
          CIBLE=$(python3 -c "import os;print(max(${{ inputs.cible }}, float(open('objectif.txt').read()) if os.path.exists('objectif.txt') else 0))")
          PAR=${{ inputs.par_espece }}; ALPHA=${{ inputs.alpha }}; TOURS=${{ inputs.tours }}
          PLUS=$(python3 -c "print(min(${{ inputs.maximum }}, $PAR + ${{ inputs.ajout }}))")
          if python3 -c "import sys;sys.exit(0 if $TOP3 < $CIBLE else 1)"; then
            if [ "$TOURS" -gt 1 ] && [ "$PLUS" -gt "$PAR" ]; then
              echo "Objectif $CIBLE pas atteint : nouvelle boucle avec $PLUS photos par espèce." | tee -a journal.txt
              NPAR=$PLUS; NALPHA=$ALPHA; NTOURS=$(( TOURS - 1 ))
            elif [ "$ALPHA" != "1.0" ]; then
              echo "Objectif $CIBLE pas atteint et photos au maximum : nouvelle boucle avec une IA plus grosse (alpha 1.0)." | tee -a journal.txt
              NPAR=$PAR; NALPHA=1.0; NTOURS=1
            else
              echo "Objectif $CIBLE pas atteint, mais plus rien à augmenter : fin des boucles." | tee -a journal.txt
              NPAR=""
            fi
            if [ -n "$NPAR" ]; then
              gh workflow run entrainer.yml --ref main -f groupe="$G" -f especes="${{ inputs.especes }}" -f par_espece="$NPAR" -f alpha="$NALPHA" \
                -f epoques_fines="${{ inputs.epoques_fines }}" -f figer="${{ inputs.figer }}" -f tours="$NTOURS" -f cible="$CIBLE" \
                -f ajout="${{ inputs.ajout }}" -f maximum="${{ inputs.maximum }}"
            fi
          else
            echo "Objectif $CIBLE atteint : fin des boucles." | tee -a journal.txt
          fi

      - name: Résumé du journal
        if: always()
        run: |
          touch journal.txt
          python3 - <<'PY'
          lignes = [l.rstrip() for l in open('journal.txt', errors='replace')]
          garde = [l for l in lignes if l.startswith(('  -', '  !', 'Temps', 'Résultat', 'Modèle', 'Terminé', 'Traceback', 'Epoch', 'Vérification', 'Publié', 'Objectif', 'Collecte', 'Minutes')) or 'Error' in l or 'espèces' in l or 'top1' in l]
          t = '\n'.join(garde[-120:] + ['--- fin du journal ---'] + lignes[-40:])
          for i in range(0, min(len(t), 45000), 3000):
              m = t[i:i+3000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::notice title=Journal {i // 3000 + 1:02d}::{m}")
          PY
